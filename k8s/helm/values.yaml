configuration:
  # extraArgs: ["--fs-backup-timeout=240m"]
  # features: EnableCSI
  backupStorageLocation:
    - name: minio  # default is 'default'
      bucket: alyvusal-terraform-backend  # Name of bucket
      # Set true for backup all pod volumes without having to apply annotation on the pod when used file system backup
      defaultVolumesToFsBackup: False
      provider: aws
      config:
        region: us-east-1
        s3ForcePathStyle: true  # Only needed when S3-compatible storage is used instead of AWS S3 storage
        s3Url: https://minio-192.168.0.100.nip.io/buckets/alyvusal-terraform-backend # <- Only needed when S3-compatible storage is used instead of AWS S3 storage
  volumeSnapshotLocation:
    - provider: aws
      config:
        region: us-east-1
